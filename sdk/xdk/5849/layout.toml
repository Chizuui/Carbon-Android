# XDK 5849 library data layouts the runtime reads or writes. The offsets are the XDK 5849 struct layout,
# the same in every 5849 title; the spot-checked ones match Carbon's XBE. Only the offsets matter here —
# no code addresses from other titles' XBEs are cited.
[layout]
# D3D8 CDevice, the static device D3D__pDevice points at
CDevice_Push          = 0x0     # D3DDevice_SetTexture reads it, compares with +4, calls MakeSpace
CDevice_PushThreshold = 0x4     # D3DDevice_SetTexture compares the push pointer with it
CDevice_BaseVertex    = 0x1C    # D3DDevice_SetIndices stores BaseVertexIndex
CDevice_IndexBuffer   = 0x7A0   # D3DDevice_SetIndices reads the old one, stores the new one
CDevice_ZScale        = 0x948   # D3DDevice_GetViewportOffsetAndScale scales the Z range by it
CDevice_SuperSampleX  = 0x95C   # D3DDevice_GetViewportOffsetAndScale scales viewport X by it
CDevice_SuperSampleY  = 0x960   # D3DDevice_GetViewportOffsetAndScale scales viewport Y by it
CDevice_Transforms    = 0xC60   # D3DDevice_SetTransform copies 16 dwords to +0xC60 + type * 64
CDevice_Textures      = 0xF88   # D3DDevice_SetTexture reads, stores [stage]
CDevice_Palettes      = 0xF98   # reads [stage] (state query), the device teardown releases them; D3DDevice_SetPalette stores [stage]
CDevice_RenderTarget  = 0x1A04  # D3DDevice_GetRenderTarget2 returns it
CDevice_Depth         = 0x1A08  # D3DDevice_GetDepthStencilSurface2 returns it
CDevice_BackBuffer    = 0x1A14  # D3DDevice_GetBackBuffer2 returns it for index 0
CDevice_FrontBuffer   = 0x1A18  # D3DDevice_GetBackBuffer2 returns it for index -1
CDevice_SwapCount     = 0x2478  # D3DDevice_Swap increments it, the getter returns it
CDevice_Size          = 0x24A0  # Direct3D_CreateDevice clears 0x928 dwords of the device on failure
CDevice_Flags             = 0x8    # Direct3D_CreateDevice ors BehaviorFlags & 0x10 into it, D3DDevice_SetPixelShader tests that bit
CDevice_Time              = 0x2C   # D3D_KickOffAndWaitForIdle passes it to D3D_BlockOnTime, D3D_SetFence adds 2
CDevice_PixelShader       = 0x784  # D3DDevice_SetPixelShader stores the handle
CDevice_VertexShader      = 0x794  # the device init stores the FVF shader object, D3DDevice_SetVertexShader the current one
CDevice_BackBufferScale   = 0x96C  # the frame buffer init stores the X scale as a float, the Y scale at +4
CDevice_Viewport          = 0xEE0  # D3DDevice_SetViewport stores X, Y, Width, Height, MinZ, MaxZ
CDevice_ScreenSpaceOffset = 0xEF8  # D3DDevice_SetScreenSpaceOffset stores x + 0.53125, y + 0.53125 at +4
CDevice_AutoDepth         = 0x1A20 # the frame buffer init stores the depth buffer, D3D_InitDefaultState reads it
CDevice_VBlankCallback    = 0x1DB8 # the vertical blank handler calls [miniport + 0x190], the miniport is at +0x1C28
CDevice_VBlankEvent       = 0x1DBC # D3DDevice_BlockUntilVerticalBlank waits on it, clears its SignalState
CDevice_DisplayFlags      = 0x1DDC # D3D_GetAdapterDisplayMode reads it, the mode set stores the mode entry at miniport + 0x1B4
CDevice_VBlankCount       = 0x1DE8 # the vertical blank handler increments miniport + 0x1C0
CDevice_Field             = 0x1DF8 # the vertical blank handler stores the field at miniport + 0x1D0; D3DDevice_GetDisplayFieldStatus reads it
CDevice_GammaRamps        = 0x1E04 # D3DDevice_SetGammaRamp copies to miniport + 0x1DC + index * 0x300
CDevice_GammaPending      = 0x2404 # D3DDevice_SetGammaRamp sets [miniport + 0x7DC + index * 4]
# D3D8 globals
DirtyFlags_Texture    = 0x4800  # D3DDevice_SetTexture ors it into D3D__DirtyFlags
TextureState_Stage    = 32      # D3DDevice_SetTextureStageStateNotInline: [stage * 32 + type] dwords
Stream_Size           = 12      # D3DDevice_SetStreamSource indexes the stream table by n * 12
Stream_Stride         = 0x0     # D3DDevice_SetStreamSource stores Stride
Stream_Buffer         = 0x8     # D3DDevice_SetStreamSource stores the vertex buffer
PixelShader_Definition = 0x8  # D3DDevice_CreatePixelShader stores the definition pointer, D3DDevice_SetPixelShader reads it
# DSOUND
CDirectSoundStream_Vtable  = 0x0  # CDirectSoundStream constructor stores the first vtable
CDirectSoundStream_Vtable2 = 0x4  # CDirectSoundStream constructor stores the second vtable
EffectsImage_Skip0    = 0x804   # (reached from CDirectSound_DownloadEffectsImage) adds this dword count
EffectsImage_Skip1    = 0x80C   # loads this dword count
EffectsImage_Desc     = 0x818   # descriptor at image + 0x818 + (Skip0 + Skip1) * 4
# XAPI XPP device type record
XPP_Current           = 0x0     # XGetDevices returns it
XPP_Changed           = 0x4     # XGetDevices clears it, XGetDeviceChanges tests it
XPP_Previous          = 0x8     # XGetDevices copies Current into it
